<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWN</title>
    <link rel="icon" type="image/png" href="resources/own.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div class="navbar">

            <div class="nav-logo">
                <div class="logo"></div>
            </div>

            <div class="nav-addr-box">
                <i class="fa-solid fa-location-dot"></i>
                <div class="nav-addr-text">
                    <p class="nav-delivery">Delivered to</p>
                    <p class="nav-location">Bangladesh</p>
                </div>
            </div>

            <div class="search-box">
                <select class="search-type">
                    <option>All</option>
                </select>
                <input placeholder="Search on OWN" class="search-input">
                <button class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i> 
                </button>
            </div>

            <div class="nav-signin">
                <span class="nav-first">Hello, sign in</span>
                <p class="nav-second">Account & Lists</p>
            </div>
            
            <div class="nav-ret">
                <span class="nav-first">Returns</span>
                <p class="nav-second">& Orders</p>
            </div>

            <div class="cart">
                <button class="cart-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                </button>
                <p class="nav-second">Cart</p>
            </div>

        </div>

        <div class="panel">
            <div class="panel-all">
            <i class="fa-solid fa-list"></i> All
            </div>
            <div class="panel-ops">
                <p>Today's Deal</p>
                <p>Customer Services</p>
                <p> Registry</p>
                <p>Gift Cards</p>
                <p>Sell</p>
            </div>
            <div class="panel-deals">
                Shop deals in Electronics 
            </div>
            
        </div>
    </header>
</body>
</html>
